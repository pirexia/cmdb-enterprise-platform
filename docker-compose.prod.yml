# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — CMDB Enterprise Platform (Production)
#
# Architecture (all traffic through nginx):
#   Browser → nginx:443 (HTTPS) → frontend:3001 or backend:3000 (HTTP internal)
#
# Production hardening vs docker-compose.yml:
#   • PostgreSQL NOT exposed to host — internal network only
#   • Backend NOT exposed to host — internal network only
#   • Separate networks: cmdb-internal (DB↔backend) and cmdb-public (nginx↔frontend↔backend)
#   • Named volumes for data and TLS certificate storage
#   • restart: unless-stopped on all services
#   • no-new-privileges security option on all services
#   • No Adminer
#
# Usage:
#   bash scripts/install.sh          # recommended — interactive installer
#   # or manually:
#   cp .env.example .env && docker compose -f docker-compose.prod.yml up -d --build
#
# SELinux (RHEL/CentOS): :Z suffix relabels volumes for Enforcing mode.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cmdb-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data:Z
    # PostgreSQL NOT exposed to host — internal network only
    networks:
      - cmdb-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  # ── Backend — Express + Prisma ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cmdb-backend:latest
    container_name: cmdb-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV:      production
      PORT:          3000
      DATABASE_URL:  postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_URL:  ${FRONTEND_URL:?FRONTEND_URL is required}
      DOCUMENTS_DIR: /app/documents
      # SMTP (optional — leave SMTP_USER empty to disable alert emails)
      SMTP_HOST:     ${SMTP_HOST:-}
      SMTP_PORT:     ${SMTP_PORT:-587}
      SMTP_SECURE:   ${SMTP_SECURE:-false}
      SMTP_USER:     ${SMTP_USER:-}
      SMTP_PASS:     ${SMTP_PASS:-}
      ALERT_RECIPIENT: ${ALERT_RECIPIENT:-}
      # LDAP / Active Directory (optional)
      USE_LDAP:          ${USE_LDAP:-false}
      LDAP_URL:          ${LDAP_URL:-}
      LDAP_BASE_DN:      ${LDAP_BASE_DN:-}
      LDAP_BIND_DN:      ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-1}
      # Microsoft 365 SSO (optional)
      USE_MICROSOFT_SSO:    ${USE_MICROSOFT_SSO:-false}
      AZURE_TENANT_ID:      ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID:      ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET:  ${AZURE_CLIENT_SECRET:-}
      AZURE_REDIRECT_URI:   ${AZURE_REDIRECT_URI:-}
      AZURE_ALLOWED_DOMAIN: ${AZURE_ALLOWED_DOMAIN:-}
      AZURE_AUTO_PROVISION: ${AZURE_AUTO_PROVISION:-false}
    volumes:
      # Shared TLS certs — backend writes CSR/key here via admin UI
      - tls-certs:/app/certs:Z
      - ${DOCUMENTS_STORAGE_PATH:-./document-storage}:/app/documents:Z
    # Backend NOT exposed to host — reachable only via nginx (/api/*)
    networks:
      - cmdb-internal
      - cmdb-public
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # ── Frontend — Next.js standalone ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL must be the public HTTPS URL (same host as frontend,
        # since nginx serves both on 443 — no port suffix needed).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_TRUSTED_DEVICE_TTL_DAYS: ${NEXT_PUBLIC_TRUSTED_DEVICE_TTL_DAYS:-30}
        NEXT_PUBLIC_PASSWORD_MIN_LENGTH_ADMIN: ${PASSWORD_MIN_LENGTH_ADMIN:-16}
        NEXT_PUBLIC_PASSWORD_MIN_LENGTH_VIEWER: ${PASSWORD_MIN_LENGTH_VIEWER:-12}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-CMDB Enterprise}
    image: cmdb-frontend:latest
    container_name: cmdb-frontend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT:     3001
    # Frontend NOT exposed to host — reachable only via nginx (/)
    networks:
      - cmdb-public
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

  # ── Nginx — unified TLS gateway ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: cmdb-nginx-prod
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,Z
      # Shared TLS certs (read-only for nginx)
      # Populated by install.sh: docker run ... alpine cp /src/server.{key,crt} /dst/
      - tls-certs:/etc/nginx/certs:ro,Z
    ports:
      - "443:443"   # HTTPS — all traffic enters here
      - "80:80"     # HTTP → HTTPS redirect
    networks:
      - cmdb-public
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: cmdb-postgres-data-prod
  tls-certs:
    name: cmdb-tls-certs
    # Populated by install.sh. To populate manually:
    #   docker volume create cmdb-tls-certs
    #   docker run --rm -v cmdb-tls-certs:/dst -v $(pwd)/certs:/src:ro alpine \
    #     sh -c "cp /src/server.key /src/server.crt /dst/ && chmod 600 /dst/server.key"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  cmdb-internal:
    name: cmdb-internal
    internal: true    # postgres ↔ backend only; DB not reachable from nginx/frontend

  cmdb-public:
    name: cmdb-public  # nginx ↔ frontend ↔ backend
