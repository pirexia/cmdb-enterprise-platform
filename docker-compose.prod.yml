# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — CMDB Enterprise Platform (Production)
#
# Architecture (all traffic through nginx):
#   Browser → nginx:443 (HTTPS) → frontend:3001 or backend:3000 (HTTP internal)
#
# Production hardening vs docker-compose.yml:
#   • PostgreSQL NOT exposed to host — internal network only
#   • Backend NOT exposed to host — internal network only
#   • Separate networks: cmdb-internal (DB↔backend) and cmdb-public (nginx↔frontend↔backend)
#   • Named volumes for data and TLS certificate storage
#   • restart: unless-stopped on all services
#   • no-new-privileges security option on all services
#   • No Adminer
#
# Usage:
#   bash scripts/install.sh          # recommended — interactive installer
#   # or manually:
#   cp .env.example .env && docker compose -f docker-compose.prod.yml up -d --build
#
# SELinux (RHEL/CentOS): :Z suffix relabels volumes for Enforcing mode.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: cmdb-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data:Z
    # PostgreSQL NOT exposed to host — internal network only
    networks:
      - cmdb-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  # ── Backend — Express + Prisma ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cmdb-backend:latest
    container_name: cmdb-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV:      production
      PORT:          3000
      DATABASE_URL:  postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_URL:  ${FRONTEND_URL:?FRONTEND_URL is required}
      DOCUMENTS_DIR: /app/documents
      # SMTP (optional — leave SMTP_USER empty to disable alert emails)
      SMTP_HOST:     ${SMTP_HOST:-}
      SMTP_PORT:     ${SMTP_PORT:-587}
      SMTP_SECURE:   ${SMTP_SECURE:-false}
      SMTP_USER:     ${SMTP_USER:-}
      SMTP_PASS:     ${SMTP_PASS:-}
      ALERT_RECIPIENT: ${ALERT_RECIPIENT:-}
      # Nginx version — read by systemInfoService for System Info display
      # Update this when changing the nginx image tag
      NGINX_VERSION: "1.30"
      # LDAP / Active Directory (optional)
      USE_LDAP:          ${USE_LDAP:-false}
      LDAP_URL:          ${LDAP_URL:-}
      LDAP_BASE_DN:      ${LDAP_BASE_DN:-}
      LDAP_BIND_DN:      ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-1}
      # Microsoft 365 SSO (optional)
      USE_MICROSOFT_SSO:    ${USE_MICROSOFT_SSO:-false}
      AZURE_TENANT_ID:      ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID:      ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET:  ${AZURE_CLIENT_SECRET:-}
      AZURE_REDIRECT_URI:   ${AZURE_REDIRECT_URI:-}
      AZURE_ALLOWED_DOMAIN: ${AZURE_ALLOWED_DOMAIN:-}
      AZURE_AUTO_PROVISION: ${AZURE_AUTO_PROVISION:-false}
      # ── RAG / Ollama ──────────────────────────────────────────────────────────
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      RAG_ENABLED:     ${RAG_ENABLED:-true}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-bge-m3}
      RAG_CHAT_MODEL:  ${RAG_CHAT_MODEL:-qwen3:latest}
      RAG_CHAT_TEMPERATURE: ${RAG_CHAT_TEMPERATURE:-0.1}
      RAG_TOP_K:       ${RAG_TOP_K:-6}
      RAG_RATE_LIMIT_PER_MIN: ${RAG_RATE_LIMIT_PER_MIN:-10}
      # Max tokens to generate per response (0 = unlimited). Lower = faster on CPU.
      RAG_NUM_PREDICT:      ${RAG_NUM_PREDICT:-768}
      # Chat inference timeout in ms. Raise if CPU inference is slower than default.
      RAG_CHAT_TIMEOUT_MS:  ${RAG_CHAT_TIMEOUT_MS:-180000}
      # ── OCR — Tesseract fallback for scanned PDFs ─────────────────────────────
      OCR_ENABLED:      ${OCR_ENABLED:-true}
      OCR_LANGUAGES:    ${OCR_LANGUAGES:-spa+eng}
      OCR_DPI:          ${OCR_DPI:-300}
      OCR_TIMEOUT_MS:   ${OCR_TIMEOUT_MS:-180000}
      OCR_DOC_TIMEOUT_MS: ${OCR_DOC_TIMEOUT_MS:-600000}
      OCR_MAX_PAGES:    ${OCR_MAX_PAGES:-50}
      # ── Bulk document import (staging + AI analysis) ──────────────────────────
      BULK_MAX_FILES:        ${BULK_MAX_FILES:-20}
      BULK_MAX_TOTAL_MB:     ${BULK_MAX_TOTAL_MB:-200}
      BULK_BATCH_TTL_HOURS:  ${BULK_BATCH_TTL_HOURS:-24}
      BULK_ANALYZE_BUDGET:   ${BULK_ANALYZE_BUDGET:-2}
      BULK_MAX_OPEN_BATCHES: ${BULK_MAX_OPEN_BATCHES:-5}
      BULK_MAX_USER_STAGING_MB: ${BULK_MAX_USER_STAGING_MB:-500}
      BULK_REAPED_RETENTION_DAYS: ${BULK_REAPED_RETENTION_DAYS:-7}
      # ── Plugin Engine ─────────────────────────────────────────────────────────
      PLUGIN_STORAGE_PATH: ${PLUGIN_STORAGE_PATH:-/var/lib/cmdb/plugins}
      PLUGIN_MAX_SIZE_MB:  ${PLUGIN_MAX_SIZE_MB:-50}
      PLUGIN_DATABASE_URL: ${PLUGIN_DATABASE_URL:?PLUGIN_DATABASE_URL required for plugin DDL migrations}
      PLUGIN_REQUIRE_APPROVAL_PROD: ${PLUGIN_REQUIRE_APPROVAL_PROD:-true}
      PLUGIN_ENABLE_MARKETPLACE: ${PLUGIN_ENABLE_MARKETPLACE:-true}
      PLUGIN_MARKETPLACE_URL: ${PLUGIN_MARKETPLACE_URL:-}
      PLUGIN_SIGNING_PUBLIC_KEY: ${PLUGIN_SIGNING_PUBLIC_KEY:-}
      # ── Backup (T7 — n8n workflow "Backup CMDB") ──────────────────────────────
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # v3.0.0 — M2M service auth token (shared with n8n)
      CMDB_SERVICE_TOKEN: ${CMDB_SERVICE_TOKEN:?CMDB_SERVICE_TOKEN required (min 32 chars)}
    volumes:
      # Shared TLS certs — backend writes CSR/key here via admin UI
      - tls-certs:/app/certs:Z
      - ${DOCUMENTS_STORAGE_PATH:-./document-storage}:/app/documents:Z
      - cmdb-plugins:/var/lib/cmdb/plugins:Z
      - ${BACKUP_LOCAL_PATH:-/var/backups/cmdb}:/app/backups:Z
    # Backend NOT exposed to host — reachable only via nginx (/api/*)
    networks:
      - cmdb-internal
      - cmdb-public
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # ── Frontend — Next.js standalone ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL must be the public HTTPS URL (same host as frontend,
        # since nginx serves both on 443 — no port suffix needed).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_TRUSTED_DEVICE_TTL_DAYS: ${NEXT_PUBLIC_TRUSTED_DEVICE_TTL_DAYS:-30}
        NEXT_PUBLIC_PASSWORD_MIN_LENGTH_ADMIN: ${PASSWORD_MIN_LENGTH_ADMIN:-16}
        NEXT_PUBLIC_PASSWORD_MIN_LENGTH_VIEWER: ${PASSWORD_MIN_LENGTH_VIEWER:-12}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-CMDB Enterprise}
        # Bulk import client-side limits (must match backend BULK_MAX_* for clean UX)
        NEXT_PUBLIC_BULK_MAX_FILES: ${BULK_MAX_FILES:-20}
        NEXT_PUBLIC_BULK_MAX_TOTAL_MB: ${BULK_MAX_TOTAL_MB:-200}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: cmdb-frontend:latest
    container_name: cmdb-frontend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT:     3001
    # Frontend NOT exposed to host — reachable only via nginx (/)
    networks:
      - cmdb-public
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

  # ── Nginx — unified TLS gateway ──────────────────────────────────────────────
  nginx:
    image: docker.io/library/nginx:1.30-alpine
    container_name: cmdb-nginx-prod
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,Z
      # Shared TLS certs (read-only for nginx)
      # Populated by install.sh: docker run ... alpine cp /src/server.{key,crt} /dst/
      - tls-certs:/etc/nginx/certs:ro,Z
    ports:
      - "${NGINX_HTTPS_PORT:-443}:443"   # HTTPS — all traffic enters here
      - "${NGINX_HTTP_PORT:-80}:80"      # HTTP → HTTPS redirect
    networks:
      - cmdb-public
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  # ── Ollama — Local LLM inference (embeddings + chat) ────────────────────────
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: cmdb-ollama-prod
    restart: unless-stopped
    environment:
      OLLAMA_MODELS: /root/.ollama/models
      # Keep models loaded in memory indefinitely (avoid cold-load latency on each query).
      # Set to a duration (e.g. "30m") or "0" to unload immediately after each request.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ${OLLAMA_MODELS_PATH:-/opt/cmdb-data/ollama-models}:/root/.ollama/models:Z
    networks:
      - cmdb-internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/11434' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  # ── Redis — BullMQ queue para n8n Queue Mode ─────────────────────────────────
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: cmdb-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save ""
      --appendonly no
    volumes:
      - redis-data:/data:Z
    networks:
      - cmdb-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # ── n8n Main — UI + API + Webhook triggers ───────────────────────────────────
  n8n-main:
    image: docker.io/n8nio/n8n:1
    container_name: cmdb-n8n-main
    restart: unless-stopped
    environment:
      # Queue Mode
      EXECUTIONS_MODE: queue
      # Execution data retention — RAG indexing polls every 30s (~2.880 ejecuciones/día).
      # Sin esto, execution_entity crece sin límite (hinchazón BD + UI lenta). Solo se
      # guardan ejecuciones FALLIDAS, retenidas 7 días; purga automática con tope de filas.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      # Database (schema separado n8n_data en PostgreSQL existente — Decisión D1)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_POSTGRESDB_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POSTGRESDB_SCHEMA: n8n_data
      # Redis BullMQ
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Encryption key for stored credentials — CRITICAL: do not change after first run
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      # Public path and webhooks
      N8N_PATH: /n8n/
      WEBHOOK_URL: ${WEBHOOK_URL:-https://localhost/n8n/}
      N8N_PROXY_HOPS: 1
      # Basic auth (nginx also enforces auth_request ADMIN gate)
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-n8n-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}
      # Service token for /api/internal/* calls from workflows
      CMDB_SERVICE_TOKEN: ${CMDB_SERVICE_TOKEN:?CMDB_SERVICE_TOKEN is required}
      # Disable telemetry and external n8n.io calls (CSP would block them anyway)
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Timezone
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
    volumes:
      - n8n-data:/home/node/.n8n:Z
    # n8n NOT exposed to host — only accessible via nginx /n8n/ (IP allowlist + ADMIN gate)
    networks:
      - cmdb-internal
      - cmdb-public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ── n8n Worker 1 — Executes queued jobs ──────────────────────────────────────
  n8n-worker-1:
    image: docker.io/n8nio/n8n:1
    container_name: cmdb-n8n-worker-1
    restart: unless-stopped
    command: worker
    environment:
      EXECUTIONS_MODE: queue
      # Execution data retention (ver n8n-main) — el worker es quien persiste la
      # ejecución en queue mode, así que estas vars deben estar también aquí.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_POSTGRESDB_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POSTGRESDB_SCHEMA: n8n_data
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      CMDB_SERVICE_TOKEN: ${CMDB_SERVICE_TOKEN:?CMDB_SERVICE_TOKEN is required}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
    # Workers are stateless: encryption key from N8N_ENCRYPTION_KEY (env), DB is
    # Postgres, binary-data mode is default (in-DB). No .n8n mount — n8n uses the
    # image's own /home/node/.n8n (node-owned, writable, ephemeral); mounting the
    # shared volume read-only crash-loops the worker on its settings write.
    networks:
      - cmdb-internal
      - cmdb-public
    depends_on:
      - n8n-main
      - redis
    security_opt:
      - no-new-privileges:true

  # ── n8n Worker 2 — Parallelism + process resilience ──────────────────────────
  n8n-worker-2:
    image: docker.io/n8nio/n8n:1
    container_name: cmdb-n8n-worker-2
    restart: unless-stopped
    command: worker
    environment:
      EXECUTIONS_MODE: queue
      # Execution data retention (ver n8n-main) — el worker es quien persiste la
      # ejecución en queue mode, así que estas vars deben estar también aquí.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_POSTGRESDB_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POSTGRESDB_SCHEMA: n8n_data
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      CMDB_SERVICE_TOKEN: ${CMDB_SERVICE_TOKEN:?CMDB_SERVICE_TOKEN is required}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
    # Workers are stateless: encryption key from N8N_ENCRYPTION_KEY (env), DB is
    # Postgres, binary-data mode is default (in-DB). No .n8n mount — n8n uses the
    # image's own /home/node/.n8n (node-owned, writable, ephemeral); mounting the
    # shared volume read-only crash-loops the worker on its settings write.
    networks:
      - cmdb-internal
      - cmdb-public
    depends_on:
      - n8n-main
      - redis
    security_opt:
      - no-new-privileges:true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: cmdb-postgres-data-prod
  cmdb-plugins:
    name: cmdb-plugins-prod
  tls-certs:
    name: cmdb-tls-certs
    # Populated by install.sh. To populate manually:
    #   docker volume create cmdb-tls-certs
    #   docker run --rm -v cmdb-tls-certs:/dst -v $(pwd)/certs:/src:ro alpine \
    #     sh -c "cp /src/server.key /src/server.crt /dst/ && chmod 600 /dst/server.key"
  n8n-data:
    name: cmdb-n8n-data
  redis-data:
    name: cmdb-redis-data

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  cmdb-internal:
    name: cmdb-internal
    internal: true    # postgres ↔ backend ↔ ollama ↔ redis; sin egress a internet

  cmdb-public:
    name: cmdb-public  # nginx ↔ frontend ↔ backend ↔ n8n (con egress para SMTP/Teams/Slack/LDAP)
