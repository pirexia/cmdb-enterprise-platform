version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# CMDB Enterprise Platform — Development Docker Compose
#
# Architecture (all traffic through nginx):
#   Browser → nginx:443 (HTTPS) → frontend:3001 or backend:3000 (HTTP internal)
#
# Tested on: RHEL 8/9, CentOS Stream 9, Ubuntu 22.04, macOS (Docker Desktop)
#
# Quick start:
#   bash scripts/install.sh     # interactive installer (recommended)
#   # or manually:
#   cp .env.example .env && docker compose up -d --build
#
# SELinux (RHEL/CentOS): The :Z suffix on volume mounts tells the container
# engine to relabel the volume content so SELinux Enforcing mode allows access.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 15 ────────────────────────────────────────────────────────────
  postgres:
    image: docker.io/pgvector/pgvector:pg15
    container_name: cmdb-postgres
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-cmdb_db}
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-cmdb_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Adminer — lightweight DB management UI (dev only) ────────────────────────
  adminer:
    image: docker.io/library/adminer:latest
    container_name: cmdb-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend — Express + Prisma API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmdb-backend
    restart: always
    environment:
      NODE_ENV:     production
      PORT:         3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cmdb_db}
      JWT_SECRET:   ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      DOCUMENTS_DIR: /app/documents
      # SMTP (optional — leave SMTP_USER empty to disable alert emails)
      SMTP_HOST:    ${SMTP_HOST:-}
      SMTP_PORT:    ${SMTP_PORT:-587}
      SMTP_SECURE:  ${SMTP_SECURE:-false}
      SMTP_USER:    ${SMTP_USER:-}
      SMTP_PASS:    ${SMTP_PASS:-}
      ALERT_RECIPIENT: ${ALERT_RECIPIENT:-}
      # Nginx version — read by systemInfoService for System Info display
      # Update this when changing the nginx image tag
      NGINX_VERSION: "1.30"
      # LDAP / Active Directory (optional — USE_LDAP=false to disable)
      USE_LDAP:          ${USE_LDAP:-false}
      LDAP_URL:          ${LDAP_URL:-}
      LDAP_BASE_DN:      ${LDAP_BASE_DN:-}
      LDAP_BIND_DN:      ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      # UPN suffix / NetBIOS domain for AD username login (optional — enables
      # login with sAMAccountName, UPN, or DOMAIN\sam in addition to email)
      LDAP_UPN_SUFFIX:      ${LDAP_UPN_SUFFIX:-}
      LDAP_NETBIOS_DOMAIN:  ${LDAP_NETBIOS_DOMAIN:-}
      # Microsoft 365 SSO (optional — USE_MICROSOFT_SSO=false to disable)
      USE_MICROSOFT_SSO:    ${USE_MICROSOFT_SSO:-false}
      AZURE_TENANT_ID:      ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID:      ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET:  ${AZURE_CLIENT_SECRET:-}
      AZURE_REDIRECT_URI:   ${AZURE_REDIRECT_URI:-}
      AZURE_ALLOWED_DOMAIN: ${AZURE_ALLOWED_DOMAIN:-}
      AZURE_AUTO_PROVISION: ${AZURE_AUTO_PROVISION:-false}
      # ── RAG / Ollama ──────────────────────────────────────────────────────────
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      RAG_ENABLED:     ${RAG_ENABLED:-true}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-bge-m3}
      RAG_CHAT_MODEL:  ${RAG_CHAT_MODEL:-qwen3:latest}
      RAG_CHAT_TEMPERATURE: ${RAG_CHAT_TEMPERATURE:-0.1}
      RAG_TOP_K:       ${RAG_TOP_K:-6}
      RAG_RATE_LIMIT_PER_MIN: ${RAG_RATE_LIMIT_PER_MIN:-10}
      RAG_NUM_PREDICT:      ${RAG_NUM_PREDICT:-768}
      RAG_CHAT_TIMEOUT_MS:  ${RAG_CHAT_TIMEOUT_MS:-180000}
      # ── OCR — Tesseract fallback for scanned PDFs ─────────────────────────────
      OCR_ENABLED:      ${OCR_ENABLED:-true}
      OCR_LANGUAGES:    ${OCR_LANGUAGES:-spa+eng}
      OCR_DPI:          ${OCR_DPI:-300}
      OCR_TIMEOUT_MS:   ${OCR_TIMEOUT_MS:-180000}
      OCR_DOC_TIMEOUT_MS: ${OCR_DOC_TIMEOUT_MS:-600000}
      OCR_MAX_PAGES:    ${OCR_MAX_PAGES:-50}
      # ── Bulk document import (staging + AI analysis) ──────────────────────────
      BULK_MAX_FILES:        ${BULK_MAX_FILES:-20}
      BULK_MAX_TOTAL_MB:     ${BULK_MAX_TOTAL_MB:-200}
      BULK_BATCH_TTL_HOURS:  ${BULK_BATCH_TTL_HOURS:-24}
      BULK_ANALYZE_BUDGET:   ${BULK_ANALYZE_BUDGET:-2}
      BULK_MAX_OPEN_BATCHES: ${BULK_MAX_OPEN_BATCHES:-5}
      BULK_MAX_USER_STAGING_MB: ${BULK_MAX_USER_STAGING_MB:-500}
      BULK_REAPED_RETENTION_DAYS: ${BULK_REAPED_RETENTION_DAYS:-7}
      # ── Plugin Engine ─────────────────────────────────────────────────────────
      PLUGIN_STORAGE_PATH: ${PLUGIN_STORAGE_PATH:-/var/lib/cmdb/plugins}
      PLUGIN_MAX_SIZE_MB:  ${PLUGIN_MAX_SIZE_MB:-50}
      PLUGIN_DATABASE_URL: ${PLUGIN_DATABASE_URL:-}
      PLUGIN_REQUIRE_APPROVAL_PROD: ${PLUGIN_REQUIRE_APPROVAL_PROD:-false}
      PLUGIN_ENABLE_MARKETPLACE: ${PLUGIN_ENABLE_MARKETPLACE:-true}
      PLUGIN_MARKETPLACE_URL: ${PLUGIN_MARKETPLACE_URL:-}
      PLUGIN_SIGNING_PUBLIC_KEY: ${PLUGIN_SIGNING_PUBLIC_KEY:-}
      # ── Backup (T7) ───────────────────────────────────────────────────────────
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      CMDB_SERVICE_TOKEN: ${CMDB_SERVICE_TOKEN:-dev-service-token-change-in-prod-min-32}
      # ── n8n Provisioning ──────────────────────────────────────────────────────
      N8N_API_KEY:       ${N8N_API_KEY:-}
      N8N_INTERNAL_URL:  ${N8N_INTERNAL_URL:-http://n8n-main:5678}
      # ── vCenter Connector (v3.5.3, optional — VCENTER_SYNC_ENABLED=false disables) ──────
      VCENTER_URL:                 ${VCENTER_URL:-}
      VCENTER_USER:                ${VCENTER_USER:-}
      VCENTER_PASSWORD:            ${VCENTER_PASSWORD:-}
      VCENTER_SSL_VERIFY:          ${VCENTER_SSL_VERIFY:-false}
      VCENTER_CA_CERT:             ${VCENTER_CA_CERT:-}
      VCENTER_SYNC_ENABLED:        ${VCENTER_SYNC_ENABLED:-false}
      VCENTER_CI_TYPE:             ${VCENTER_CI_TYPE:-VIRTUAL_SERVER}
      VCENTER_DEFAULT_ENVIRONMENT: ${VCENTER_DEFAULT_ENVIRONMENT:-PRODUCTION}
      VCENTER_DEFAULT_CRITICALITY: ${VCENTER_DEFAULT_CRITICALITY:-MEDIUM}
      VCENTER_SYNC_CRON:           ${VCENTER_SYNC_CRON:-0 */6 * * *}
    volumes:
      # Shared TLS certs — backend writes CSR/key here via admin UI
      - ./certs:/app/certs:Z
      - ${DOCUMENTS_STORAGE_PATH:-./document-storage}:/app/documents:Z
      - cmdb-plugins:/var/lib/cmdb/plugins:Z
      - ${BACKUP_LOCAL_PATH:-./backups}:/app/backups:Z
    # Backend NOT exposed to host — reachable only via nginx (/api/*)
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # ── Frontend — Next.js standalone ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # NEXT_PUBLIC_API_URL must be the public HTTPS URL (same host as frontend,
        # since nginx serves both on 443).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
        NEXT_PUBLIC_TRUSTED_DEVICE_TTL_DAYS: ${NEXT_PUBLIC_TRUSTED_DEVICE_TTL_DAYS:-30}
        NEXT_PUBLIC_PASSWORD_MIN_LENGTH_ADMIN: ${PASSWORD_MIN_LENGTH_ADMIN:-16}
        NEXT_PUBLIC_PASSWORD_MIN_LENGTH_VIEWER: ${PASSWORD_MIN_LENGTH_VIEWER:-12}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-CMDB Enterprise}
        # Bulk import client-side limits (must match backend BULK_MAX_* for clean UX)
        NEXT_PUBLIC_BULK_MAX_FILES: ${BULK_MAX_FILES:-20}
        NEXT_PUBLIC_BULK_MAX_TOTAL_MB: ${BULK_MAX_TOTAL_MB:-200}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_TAG: ${GIT_TAG:-unknown}
    container_name: cmdb-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT:     3001
    # Frontend NOT exposed to host — reachable only via nginx (/)
    depends_on:
      - backend

  # ── Nginx — unified TLS gateway ──────────────────────────────────────────────
  nginx:
    image: docker.io/library/nginx:1.30-alpine
    container_name: cmdb-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,Z
      # Shared TLS certs (read-only for nginx)
      - ./certs:/etc/nginx/certs:ro,Z
    ports:
      - "443:443"   # HTTPS — all traffic enters here
      - "80:80"     # HTTP → HTTPS redirect
    depends_on:
      - frontend
      - backend

  # ── Ollama — Local LLM inference (embeddings + chat) ────────────────────────
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: cmdb-ollama
    restart: always
    environment:
      OLLAMA_MODELS: /root/.ollama/models
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ollama-models:/root/.ollama/models:Z
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Redis — BullMQ queue para n8n Queue Mode ─────────────────────────────────
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: cmdb-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
      --save ""
      --appendonly no
    volumes:
      - redis-data:/data:Z
    # Redis not exposed to host in dev — only reachable from other containers
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── n8n Main — UI + API + Webhook triggers ───────────────────────────────────
  n8n-main:
    image: docker.io/n8nio/n8n:1
    container_name: cmdb-n8n-main
    restart: always
    environment:
      EXECUTIONS_MODE: queue
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-cmdb_db}
      DB_POSTGRESDB_USER:     ${POSTGRES_USER:-admin}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n_data
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-n8n-encryption-key-change-in-prod}
      N8N_PATH: /n8n/
      WEBHOOK_URL: ${WEBHOOK_URL:-https://localhost/n8n/}
      N8N_PROXY_HOPS: 1
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-n8n-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-n8n_dev_pass}
      CMDB_SERVICE_TOKEN: ${CMDB_SERVICE_TOKEN:-dev-service-token-change-in-prod-min-32}
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      # Execution data retention (dev: shorter than prod to keep DB small)
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 24
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 500
    volumes:
      - n8n-data:/home/node/.n8n:Z
    ports:
      - "5678:5678"   # Dev only: direct access without nginx for workflow debugging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node fetch, not wget: busybox wget's request against this n8n image
      # gets a spurious 403 even on a genuinely healthy instance (confirmed
      # live — node fetch gets a clean 200, wget does not, same endpoint).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── n8n Worker 1 ─────────────────────────────────────────────────────────────
  n8n-worker-1:
    image: docker.io/n8nio/n8n:1
    container_name: cmdb-n8n-worker-1
    restart: always
    command: worker
    environment:
      EXECUTIONS_MODE: queue
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-cmdb_db}
      DB_POSTGRESDB_USER:     ${POSTGRES_USER:-admin}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n_data
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-n8n-encryption-key-change-in-prod}
      CMDB_SERVICE_TOKEN: ${CMDB_SERVICE_TOKEN:-dev-service-token-change-in-prod-min-32}
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      # Execution data retention (ver n8n-main)
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    # Workers are stateless: encryption key from N8N_ENCRYPTION_KEY (env), DB is
    # Postgres, binary-data mode is default (in-DB). No .n8n mount — n8n uses the
    # image's own /home/node/.n8n (node-owned, writable, ephemeral); mounting the
    # shared volume read-only crash-loops the worker on its settings write.
    depends_on:
      - n8n-main
      - redis

  # ── n8n Worker 2 ─────────────────────────────────────────────────────────────
  n8n-worker-2:
    image: docker.io/n8nio/n8n:1
    container_name: cmdb-n8n-worker-2
    restart: always
    command: worker
    environment:
      EXECUTIONS_MODE: queue
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-cmdb_db}
      DB_POSTGRESDB_USER:     ${POSTGRES_USER:-admin}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n_data
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-n8n-encryption-key-change-in-prod}
      CMDB_SERVICE_TOKEN: ${CMDB_SERVICE_TOKEN:-dev-service-token-change-in-prod-min-32}
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      # Execution data retention (ver n8n-main)
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    # Workers are stateless: encryption key from N8N_ENCRYPTION_KEY (env), DB is
    # Postgres, binary-data mode is default (in-DB). No .n8n mount — n8n uses the
    # image's own /home/node/.n8n (node-owned, writable, ephemeral); mounting the
    # shared volume read-only crash-loops the worker on its settings write.
    depends_on:
      - n8n-main
      - redis

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: cmdb-postgres-data
  ollama-models:
  cmdb-plugins:
    name: cmdb-plugins
  n8n-data:
    name: cmdb-n8n-data
  redis-data:
    name: cmdb-redis-data

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  default:
    name: cmdb-network
