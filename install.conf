# CMDB Enterprise Platform — installer config (cmdb-iberia.dach800.dachser.com)

# ── Core paths ────────────────────────────────────────────────────────────────
INSTALL_DIR=/opt/cmdb-enterprise-platform
DATA_PATH=/opt/cmdb-data

# ── Public access ─────────────────────────────────────────────────────────────
PUBLIC_URL=https://cmdb-iberia.dach800.dachser.com
NGINX_HTTP_PORT=80
NGINX_HTTPS_PORT=443

# ── Branding ──────────────────────────────────────────────────────────────────
COMPANY_NAME=Dachser Iberia

# ── Database ──────────────────────────────────────────────────────────────────
# DB_PASSWORD omitido a propósito — el instalador lo auto-genera y lo muestra
# al final. Anótalo en el gestor de contraseñas.

# ── RAG / AI Assistant ────────────────────────────────────────────────────────
RAG_ENABLED=true
RAG_CHAT_MODEL=qwen2.5:7b-instruct-q4_K_M
RAG_EMBED_MODEL=bge-m3

# ── OCR — Tesseract para PDFs escaneados ──────────────────────────────────────
# OCR_ENABLED=true          # false desactiva el fallback OCR completamente
# OCR_LANGUAGES=spa+eng     # idiomas Tesseract separados por '+' (eng,spa,deu,por,fra,ita)
# OCR_DPI=300               # resolución de rasterizado: 150 (rápido) / 300 (estándar) / 600 (alta calidad)
# OCR_TIMEOUT_MS=180000     # timeout máximo por documento en ms (defecto: 3 min)

# ── Self-signed TLS certificate (subject) ─────────────────────────────────────
CERT_CN=cmdb-iberia.dach800.dachser.com
CERT_O=Dachser Iberia
CERT_OU=IT
CERT_C=ES

# ── Host tuning ───────────────────────────────────────────────────────────────
# Aplicado ya manualmente como root en /etc/sysctl.d/99-cmdb-rag.conf,
# por eso lo dejamos en false aquí (cmdb-admin no tiene sudo).
APPLY_HOST_TUNING=false

# ── Container runtime ─────────────────────────────────────────────────────────
USE_PODMAN=true
CERT_ST=Madrid
CERT_L=Madrid
