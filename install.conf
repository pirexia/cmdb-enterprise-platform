# CMDB Enterprise Platform — installer config (lx-gest01p.svc.int)
#
# Run (as root):
#   sudo chown root: install.conf && sudo chmod 600 install.conf
#   sudo bash scripts/install.sh --unattended --config-file ./install.conf \
#       --enable-rag --apply-host-tuning
#
# !! IMPORTANT !! Replace DB_PASSWORD with the output of:
#   openssl rand -base64 32
# before running the installer. Using the placeholder value WILL cause the
# install to fail the password-complexity check if entered interactively, and
# is a security risk.

# ── Core paths ────────────────────────────────────────────────────────────────
INSTALL_DIR=/opt/cmdb-data/repo
DATA_PATH=/opt/cmdb-data

# ── Public access ─────────────────────────────────────────────────────────────
PUBLIC_URL=https://lx-gest01p.svc.int
NGINX_HTTP_PORT=80
NGINX_HTTPS_PORT=443

# ── Branding ──────────────────────────────────────────────────────────────────
COMPANY_NAME=Servicios de Informacion

# ── Database ──────────────────────────────────────────────────────────────────
# !! REPLACE THIS VALUE before running the installer !!
# Generate with: openssl rand -base64 32
DB_PASSWORD=REPLACE_WITH_OPENSSL_RAND_BASE64_32

# ── RAG / AI Assistant ────────────────────────────────────────────────────────
RAG_ENABLED=true
RAG_CHAT_MODEL=qwen2.5:7b-instruct-q4_K_M
RAG_EMBED_MODEL=bge-m3

# ── Host tuning ───────────────────────────────────────────────────────────────
APPLY_HOST_TUNING=true

# ── Container runtime ─────────────────────────────────────────────────────────
USE_PODMAN=true
