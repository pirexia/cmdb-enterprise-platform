# ─────────────────────────────────────────────────────────────────────────────
# nginx/conf.d/frontend.conf
#
# Unified TLS gateway for CMDB Enterprise Platform.
#
# Architecture:
#   Internet → nginx (443 HTTPS / 80 redirect)
#     /        → frontend:3001  (Next.js, HTTP internal)
#     /api/*   → backend:3000   (Express, HTTP internal)
#
# Both services are internal-only — no host ports exposed except nginx.
# Certificates are mounted read-only from the host at /etc/nginx/certs/.
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# ── HTTPS unified gateway ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2  on;
    server_name _;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Security headers (frontend responses) ─────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self'; font-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── /api/internal/* — never proxied to internet ──────────────────────────
    # This path is only reachable by n8n-workers via the internal Podman network.
    # nginx blocks any browser/external request that somehow reaches this path.
    location /api/internal/ {
        deny all;
        return 404;
    }

    # ── n8n UI — /n8n/ — IP allowlist + ADMIN JWT gate ───────────────────────
    # Only accessible from N8N_ALLOWED_IPS (set in .env / nginx config).
    # auth_request validates the user's CMDB JWT and checks ADMIN role.
    # The auth endpoint itself uses the same JWT cookie as the main app.
    #
    # Configure N8N_ALLOWED_IPS in .env and replace the allow directives below.
    # Example: allow 192.168.1.0/24; allow 10.0.0.0/8; deny all;
    location /n8n/ {
        # ── IP allowlist (replace with your corporate IPs / VPN range) ────────
        # Uncomment and adjust in production:
        # allow 127.0.0.1;
        # allow ::1;
        # deny all;

        # ── ADMIN JWT gate via auth_request ───────────────────────────────────
        # Validates the user's CMDB session cookie (role=ADMIN required).
        # Returns 200 → proceed; 401/403 → deny with redirect to login.
        auth_request /api/internal/n8n-gate;
        error_page 401 = @n8n_auth_error;
        error_page 403 = @n8n_auth_error;

        # ── Proxy to n8n-main ─────────────────────────────────────────────────
        proxy_pass         http://n8n-main:5678;
        proxy_http_version 1.1;

        # WebSocket support (n8n UI uses WS for live execution updates)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 50m;
    }

    # Auth request subrequest (no client body forwarded)
    location = /api/internal/n8n-gate {
        internal;
        proxy_pass              http://backend:3000/api/internal/n8n-gate;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        Cookie         $http_cookie;
        proxy_set_header        Authorization  $http_authorization;
    }

    location @n8n_auth_error {
        return 302 /?redirect=n8n;
    }

    # ── RAG chat streaming — /api/chat/* ─────────────────────────────────────
    # SSE / chunked-transfer endpoint: buffering must be disabled so tokens
    # reach the browser as they are generated by the LLM.
    location /api/chat/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        '';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── Backend API — /api/* ──────────────────────────────────────────────────
    # Proxied to the backend Express server (plain HTTP internal).
    # The path is preserved: /api/health → backend:3000/api/health
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Allow large file uploads (document / certificate upload)
        client_max_body_size 50m;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
        proxy_cache     off;
    }

    # ── Frontend — / ──────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:3001;
        proxy_http_version 1.1;

        # Strip upstream security headers so nginx's own (above) are the sole source.
        # Without this, browser enforces both — takes the most restrictive intersection.
        proxy_hide_header  Content-Security-Policy;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  X-Content-Type-Options;
        proxy_hide_header  Referrer-Policy;
        proxy_hide_header  X-XSS-Protection;
        proxy_hide_header  Permissions-Policy;
        proxy_hide_header  Strict-Transport-Security;

        # WebSocket support (Next.js HMR / future use)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Next.js static assets — aggressive caching ───────────────────────────
    location /_next/static/ {
        proxy_pass http://frontend:3001;
        proxy_set_header Host             $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
