# ─────────────────────────────────────────────────────────────────────────────
# nginx/conf.d/frontend.conf
#
# TLS termination proxy for the CMDB Enterprise Platform frontend.
#
# Architecture:
#   Internet → nginx (443 HTTPS / 80 redirect) → frontend:3001 (HTTP, internal)
#
# Certificates are mounted read-only from the host at /etc/nginx/certs/.
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS permanently
    return 301 https://$host$request_uri;
}

# ── HTTPS frontend proxy ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2  on;
    server_name _;

    # ── TLS configuration ─────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Modern TLS only (TLS 1.2 minimum, prefer TLS 1.3)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Security headers ──────────────────────────────────────────────────────
    # HSTS: force HTTPS for 1 year (do NOT enable includeSubDomains unless all
    # subdomains also serve HTTPS)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer policy — send full URL only to same origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # XSS filter (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Permissions policy — disable unused powerful features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Proxy to Next.js frontend (plain HTTP inside the Docker network) ───────
    location / {
        proxy_pass         http://frontend:3001;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR / future use)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Pass real client information to the app
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Next.js static assets — aggressive caching ───────────────────────────
    # Next.js includes a content hash in _next/static filenames so these are
    # safe to cache forever.
    location /_next/static/ {
        proxy_pass http://frontend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-add security headers (add_header is not inherited in nested blocks)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
