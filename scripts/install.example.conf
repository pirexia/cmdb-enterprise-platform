# CMDB Enterprise Platform — installer config file (example)
# Copy this file to install.conf and edit it for your environment.
# Then run: sudo bash scripts/install.sh --unattended --config-file ./install.conf
#
# Permissions on this file MUST be 600 (chmod 600) and owned by root:
#   sudo chown root: install.conf && sudo chmod 600 install.conf

# ── Core paths ────────────────────────────────────────────────────────────────
INSTALL_DIR=/opt/cmdb-data/repo
DATA_PATH=/opt/cmdb-data

# ── Public access ─────────────────────────────────────────────────────────────
PUBLIC_URL=https://cmdb.example.com
NGINX_HTTP_PORT=80
NGINX_HTTPS_PORT=443

# ── Branding ──────────────────────────────────────────────────────────────────
COMPANY_NAME=ACME Corporation

# ── Database ──────────────────────────────────────────────────────────────────
# Use a strong random value (e.g. openssl rand -base64 32).
# Leave blank to auto-generate during install.
DB_PASSWORD=CHANGE_ME_TO_A_STRONG_PASSWORD

# ── RAG / AI Assistant ────────────────────────────────────────────────────────
# Set to "true" to enable the RAG subsystem.  Requires Phase 10b bootstrap and
# sufficient RAM/CPU — see docs/RAG_HOST_PREPARATION.md.
# Recommended minimum: 16 GB RAM + 8 vCPU for the 7b model.
RAG_ENABLED=true
RAG_CHAT_MODEL=qwen2.5:7b-instruct-q4_K_M
RAG_EMBED_MODEL=bge-m3

# ── Host tuning ───────────────────────────────────────────────────────────────
# Set to "true" to apply sysctl, file-descriptor limits, and firewalld rules
# (Linux only; macOS is silently skipped).
APPLY_HOST_TUNING=true

# ── Container runtime ─────────────────────────────────────────────────────────
# Leave commented for auto-detect, or uncomment to force Podman.
# USE_PODMAN=true

# ── First admin (optional — admin can be created interactively after install) ─
# ADMIN_EMAIL=admin@example.com
# ADMIN_PASSWORD=

# ── TLS certificate mode ──────────────────────────────────────────────────────
# Leave unset (or "a") for auto-generated self-signed cert.
# Set to "b" and provide SSL_CERT_PATH / SSL_KEY_PATH for a CA-signed cert.
# SSL_CHOICE=a
# SSL_CERT_PATH=/path/to/server.crt
# SSL_KEY_PATH=/path/to/server.key

# ── SMTP (optional) ───────────────────────────────────────────────────────────
# SMTP_HOST=smtp.example.com
# SMTP_PORT=587
# SMTP_SECURE=false
# SMTP_USER=alerts@example.com
# SMTP_PASS=
# ALERT_RECIPIENT=admin@example.com

# ── LDAP (optional) ───────────────────────────────────────────────────────────
# USE_LDAP=true
# LDAP_URL=ldaps://ldap.example.com
# LDAP_BASE_DN=dc=example,dc=com
# LDAP_BIND_DN=cn=service,dc=example,dc=com
# LDAP_BIND_PASSWORD=
# LDAP_STRICT_MODE=false
# LDAP_TLS_REJECT_UNAUTHORIZED=0

# ── Microsoft 365 SSO (optional) ──────────────────────────────────────────────
# SSO_ENABLED=true
# USE_MICROSOFT_SSO=true
# MS365_TENANT_ID=
# MS365_CLIENT_ID=
# MS365_CLIENT_SECRET=
# MS365_ALLOWED_DOMAIN=example.com
# AZURE_AUTO_PROVISION=false
